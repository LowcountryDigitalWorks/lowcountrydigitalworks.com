name: TEMP SECURITY-DEPENDENCY-005 generator

on:
  push:
    branches:
      - security/dependency-005-wrangler-4.153.0

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Generate supported dependency update with npm
        run: |
          npm install --save-dev wrangler@4.153.0 --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./node_modules/wrangler/package.json'); console.log('wrangler='+p.version)"
          node -e "const p=require('./node_modules/miniflare/package.json'); console.log('miniflare='+p.version)"
          npm ls undici --all
          npm audit --audit-level=high
          npm run test:dependency-policy
      - name: Commit generated dependency files and remove temporary generator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_tmp_security_dependency_005_generate.yml
          git add package.json package-lock.json
          git commit -m 'SECURITY-DEPENDENCY-005: update supported Wrangler graph'
          git push origin HEAD:security/dependency-005-wrangler-4.153.0
