name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Workflow install policy unit tests
        run: python tests/validate-workflow-policy.unit.py

      - name: Install dependencies from committed lockfile
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Validate repository and built site
        run: python scripts/validate_repository.py

      - name: Production smoke unit tests
        run: npm run test:smoke

      - name: Dependency policy unit tests
        run: npm run test:dependency-policy

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser and accessibility tests
        run: npm run test:e2e

      - name: Dependency audits (runtime + full tree)
        run: node scripts/dependency-audit-policy.mjs

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error
