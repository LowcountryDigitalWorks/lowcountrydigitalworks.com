name: Validate repository

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Workflow install policy unit tests
        run: python tests/validate-workflow-policy.unit.py

      - name: Install dependencies from committed lockfile
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Validate repository and built site
        run: python scripts/validate_repository.py

      - name: Production smoke unit tests
        run: npm run test:smoke

      - name: Dependency policy unit tests
        run: npm run test:dependency-policy

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser and accessibility tests
        run: npm run test:e2e

      - name: Dependency audits (runtime + full tree)
        run: node scripts/dependency-audit-policy.mjs

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error
