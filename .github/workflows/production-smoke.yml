name: Production smoke\n\non:\n  workflow_dispatch:\n  schedule:\n    - cron: '17 10 * * *'\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: production-smoke\n  cancel-in-progress: false\n\njobs:\n  smoke:\n    runs-on: ubuntu-latest\n    timeout-minutes: 5\n    steps:\n      - name: Check out repository\n        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1\n        with:\n          persist-credentials: false\n\n      - name: Set up Node.js\n        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0\n        with:\n          node-version: '22'\n\n      - name: Prove smoke assertions fail closed on synthetic regressions\n        run: node --test tests/production-smoke.unit.mjs\n\n      - name: Run read-only production smoke\n        env:\n          PRODUCTION_BASE_URL: https://lowcountrydigitalworks.com\n        run: node scripts/production-smoke.mjs\n