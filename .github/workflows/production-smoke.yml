name: Production smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Prove smoke assertions fail closed on synthetic regressions
        run: node --test tests/production-smoke.unit.mjs

      - name: Run read-only production smoke
        env:
          PRODUCTION_BASE_URL: https://lowcountrydigitalworks.com
        run: node scripts/production-smoke.mjs
