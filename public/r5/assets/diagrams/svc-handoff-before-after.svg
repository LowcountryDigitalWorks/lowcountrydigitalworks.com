<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-labelledby="hand-t hand-d">
  <title id="hand-t">Diagram: example setup — retyped by hand versus connected</title>
  <desc id="hand-d">Illustrative handoff. Retyped by hand: a Form, a person retypes it into a second tool. Connected: a Form, an Integration, one System of record.</desc>
  <rect width="680" height="420" fill="#F7F4EC"/>
  <text x="24" y="44" text-anchor="start" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="22" font-weight="800">Retyped by hand</text>
  <rect x="24" y="62" width="180" height="84" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="2"/>
  <text x="114.0" y="111.7" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="22" font-weight="700">Form</text>
  <line x1="206" y1="104" x2="230" y2="104" stroke="#15241F" stroke-width="2"/>
  <path d="M224 99 L230 104 L224 109" fill="none" stroke="#15241F" stroke-width="2"/>
  <rect x="236" y="62" width="190" height="84" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="2"/>
  <text x="331.0" y="98.5" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="22" font-weight="700">Person</text>
  <text x="331.0" y="124.9" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="22" font-weight="700">retypes</text>
  <line x1="428" y1="104" x2="452" y2="104" stroke="#15241F" stroke-width="2"/>
  <path d="M446 99 L452 104 L446 109" fill="none" stroke="#15241F" stroke-width="2"/>
  <rect x="458" y="62" width="198" height="84" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="2"/>
  <text x="557.0" y="111.7" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="22" font-weight="700">Second tool</text>
  <line x1="24" y1="188" x2="656" y2="188" stroke="#D3CDBF" stroke-width="2"/>
  <text x="24" y="232" text-anchor="start" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="22" font-weight="800">Connected</text>
  <rect x="24" y="250" width="180" height="84" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="2"/>
  <text x="114.0" y="299.7" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="22" font-weight="700">Form</text>
  <line x1="206" y1="292" x2="230" y2="292" stroke="#15241F" stroke-width="2"/>
  <path d="M224 287 L230 292 L224 297" fill="none" stroke="#15241F" stroke-width="2"/>
  <rect x="236" y="250" width="190" height="84" rx="10" fill="#1E6B66" stroke="#15241F" stroke-width="2"/>
  <text x="331.0" y="299.7" text-anchor="middle" fill="#EFE9DD" font-family="Manrope, system-ui, sans-serif" font-size="22" font-weight="700">Integration</text>
  <line x1="428" y1="292" x2="452" y2="292" stroke="#15241F" stroke-width="2"/>
  <path d="M446 287 L452 292 L446 297" fill="none" stroke="#15241F" stroke-width="2"/>
  <rect x="458" y="250" width="198" height="84" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="2"/>
  <text x="557.0" y="286.5" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="22" font-weight="700">System</text>
  <text x="557.0" y="312.9" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="22" font-weight="700">of record</text>
  <text x="24" y="388" text-anchor="start" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="22" font-weight="750">One source of truth.</text>
</svg>
