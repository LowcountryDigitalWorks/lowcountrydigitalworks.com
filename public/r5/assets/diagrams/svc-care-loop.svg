<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-labelledby="care-t care-d">
  <title id="care-t">Diagram: example setup — Website Care check loop</title>
  <desc id="care-d">Illustrative checks: Links, Accessibility, Performance, Dependencies and Content produce Findings; a person reviews; the owner approves; a change log records it.</desc>
  <rect width="680" height="420" fill="#F7F4EC"/>
  <rect x="24" y="24" width="208" height="56" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="2"/>
