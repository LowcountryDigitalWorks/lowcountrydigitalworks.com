  <line x1="500" y1="238" x2="520" y2="238" stroke="#15241F" stroke-width="2"/>
  <path d="M514 233 L520 238 L514 243" fill="none" stroke="#15241F" stroke-width="2"/>
  <rect x="522" y="196" width="142" height="84" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="2"/>
