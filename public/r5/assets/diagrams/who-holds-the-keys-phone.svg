<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 460" role="img" aria-labelledby="keys-title keys-desc">
  <title id="keys-title">Diagram: example setup — who holds the keys</title>
  <desc id="keys-desc">Illustrative diagram of domain, DNS, hosting, email, and logins pointing to the business owner.</desc>
  <rect width="360" height="460" fill="#F7F4EC"/>
  <text x="16" y="28" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="800">Who holds the keys</text>
  <text x="16" y="48" fill="#3A4A44" font-family="Manrope, system-ui, sans-serif" font-size="14">Example setup. Accounts stay in your name.</text>
  <rect x="16" y="66" width="328" height="48" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="1.5"/>
  <text x="180" y="96" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="750">Domain</text>
  <rect x="16" y="126" width="328" height="48" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="1.5"/>
  <text x="180" y="156" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="750">DNS</text>
  <rect x="16" y="186" width="328" height="48" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="1.5"/>
  <text x="180" y="216" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="750">Hosting</text>
  <rect x="16" y="246" width="328" height="48" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="1.5"/>
  <text x="180" y="276" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="750">Email</text>
  <rect x="16" y="306" width="328" height="48" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="1.5"/>
  <text x="180" y="336" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="750">Logins</text>
  <rect x="16" y="366" width="328" height="48" rx="10" fill="#1E6B66" stroke="#15241F" stroke-width="1.5"/>
  <text x="180" y="396" text-anchor="middle" fill="#EFE9DD" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="750">Owner</text>
  <text x="16" y="440" fill="#3A4A44" font-family="Manrope, system-ui, sans-serif" font-size="14">Original LDW diagram · illustrative</text>
</svg>
