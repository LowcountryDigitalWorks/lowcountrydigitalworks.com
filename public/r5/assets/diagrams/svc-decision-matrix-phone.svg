  <rect x="288" y="88" width="34" height="10" rx="5" fill="#F7F4EC" stroke="#15241F" stroke-width="1.5"/>
  <rect x="12" y="108" width="336" height="22" rx="6" fill="#FFFFFF" stroke="#15241F" stroke-width="1.5"/>
