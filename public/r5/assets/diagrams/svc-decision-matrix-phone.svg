<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" role="img" aria-labelledby="decp-t decp-d">
  <title id="decp-t">Diagram: example setup — example decision matrix</title>
  <desc id="decp-d">Illustrative comparison of Option A, B and C on Cost, Support, Security, Portability and Maintainability, ending in a recommendation with next actions. No values.</desc>
