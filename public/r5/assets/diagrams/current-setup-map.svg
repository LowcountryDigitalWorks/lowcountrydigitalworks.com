<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">Diagram: example small-business setup</title>
  <desc id="map-desc">Illustrative map of a website, email, booking, payments, and files, and the links between them.</desc>
  <rect width="960" height="320" fill="#F7F4EC"/>
  <text x="24" y="36" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="800">Current setup map</text>
  <text x="24" y="58" fill="#3A4A44" font-family="Manrope, system-ui, sans-serif" font-size="13">Diagram: example small-business setup. The useful first step is seeing how the pieces connect.</text>
  <line x1="180" y1="160" x2="480" y2="120" stroke="#C8A548" stroke-width="2"/>
  <line x1="180" y1="160" x2="480" y2="200" stroke="#C8A548" stroke-width="2"/>
  <line x1="480" y1="120" x2="780" y2="120" stroke="#1E6B66" stroke-width="2"/>
  <line x1="480" y1="200" x2="780" y2="200" stroke="#1E6B66" stroke-width="2"/>
  <line x1="480" y1="120" x2="480" y2="200" stroke="#D3CDBF" stroke-width="2"/>
<rect x="70" y="128" width="220" height="64" rx="12" fill="#15241F" stroke="#15241F" stroke-width="1.5"/>
<text x="180.0" y="166" text-anchor="middle" fill="#EFE9DD" font-family="Manrope, system-ui, sans-serif" font-size="17" font-weight="750">Website</text>
<rect x="370" y="88" width="220" height="64" rx="12" fill="#FFFFFF" stroke="#15241F" stroke-width="1.5"/>
<text x="480.0" y="126" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="17" font-weight="750">Email</text>
<rect x="370" y="168" width="220" height="64" rx="12" fill="#FFFFFF" stroke="#15241F" stroke-width="1.5"/>
<text x="480.0" y="206" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="17" font-weight="750">Booking</text>
<rect x="670" y="88" width="220" height="64" rx="12" fill="#FFFFFF" stroke="#15241F" stroke-width="1.5"/>
<text x="780.0" y="126" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="17" font-weight="750">Payments</text>
<rect x="670" y="168" width="220" height="64" rx="12" fill="#FFFFFF" stroke="#15241F" stroke-width="1.5"/>
<text x="780.0" y="206" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="17" font-weight="750">Files</text>
  <text x="24" y="276" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="13">A review starts with this map: what exists, who can sign in, and which links are fragile.</text>
  <text x="24" y="300" fill="#3A4A44" font-family="Manrope, system-ui, sans-serif" font-size="12">Original LDW diagram · illustrative · not a client network and not a security guarantee</text>
</svg>
