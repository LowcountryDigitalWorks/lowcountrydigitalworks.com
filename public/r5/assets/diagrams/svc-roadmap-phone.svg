<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="roadp-t roadp-d">
  <title id="roadp-t">Diagram: example setup — consulting roadmap</title>
  <desc id="roadp-d">Illustrative path: Current setup, Findings, Options and tradeoffs, Bounded roadmap with next actions, with a dashed branch from Findings to Leave it alone.</desc>
  <rect width="360" height="420" fill="#F7F4EC"/>
  <rect x="12" y="12" width="220" height="56" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="2"/>
  <text x="122.0" y="45.6" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="700">Current setup</text>
  <line x1="122" y1="70" x2="122" y2="94" stroke="#15241F" stroke-width="2"/>
  <path d="M117 88 L122 94 L127 88" fill="none" stroke="#15241F" stroke-width="2"/>
  <rect x="12" y="100" width="220" height="56" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="2"/>
  <text x="122.0" y="133.6" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="700">Findings</text>
  <line x1="122" y1="158" x2="122" y2="182" stroke="#15241F" stroke-width="2"/>
  <path d="M117 176 L122 182 L127 176" fill="none" stroke="#15241F" stroke-width="2"/>
  <rect x="12" y="188" width="220" height="56" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="2"/>
  <text x="122.0" y="221.6" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="700">Options and tradeoffs</text>
  <line x1="122" y1="246" x2="122" y2="270" stroke="#15241F" stroke-width="2"/>
  <path d="M117 264 L122 270 L127 264" fill="none" stroke="#15241F" stroke-width="2"/>
  <rect x="12" y="276" width="220" height="62" rx="10" fill="#1E6B66" stroke="#15241F" stroke-width="2"/>
  <text x="122.0" y="303.0" text-anchor="middle" fill="#EFE9DD" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="700">Bounded roadmap,</text>
  <text x="122.0" y="322.2" text-anchor="middle" fill="#EFE9DD" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="700">next actions</text>
  <line x1="232" y1="128" x2="262" y2="128" stroke="#15241F" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="262" y="100" width="86" height="56" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="305.0" y="124.0" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="700">Leave it</text>
  <text x="305.0" y="143.2" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="700">alone</text>
</svg>
