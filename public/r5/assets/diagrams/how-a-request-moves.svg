<text x="40" y="148" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="750">You</text>
<path d="M238 131 H254" stroke="#15241F" stroke-width="2"/>
<path d="M254 131 l8 -5 v10 z" fill="#15241F"/>
<rect x="258" y="92" width="210" height="78" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="1.5"/>
<text x="274" y="124" fill="#1E6B66" font-family="Manrope, system-ui, sans-serif" font-size="14" font-weight="800">02</text>
<text x="274" y="148" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="750">External request</text>
<path d="M472 131 H488" stroke="#15241F" stroke-width="2"/>
<path d="M488 131 l8 -5 v10 z" fill="#15241F"/>
