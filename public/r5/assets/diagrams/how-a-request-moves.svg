<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-labelledby="req-title req-desc">
  <title id="req-title">Diagram: how a request moves</title>
  <desc id="req-desc">You send a note, an external Quick Project Request is reviewed by Eddie, then you get a reply.</desc>
  <rect width="960" height="240" fill="#F7F4EC"/>
  <text x="24" y="36" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="800">How a request moves</text>
  <text x="24" y="58" fill="#3A4A44" font-family="Manrope, system-ui, sans-serif" font-size="13">Diagram of the path. No form is embedded on this site, and there are no public file uploads here.</text>
<rect x="24" y="92" width="210" height="78" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="1.5"/>
