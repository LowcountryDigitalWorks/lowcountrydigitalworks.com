<text x="508" y="124" fill="#1E6B66" font-family="Manrope, system-ui, sans-serif" font-size="14" font-weight="800">03</text>
<text x="508" y="148" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="750">Eddie reviews</text>
<path d="M706 131 H722" stroke="#15241F" stroke-width="2"/>
