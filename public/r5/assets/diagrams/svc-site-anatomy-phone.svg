  <rect x="184" y="116" width="154" height="34" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="2"/>
  <text x="261.0" y="138.6" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="700">Contact path</text>
