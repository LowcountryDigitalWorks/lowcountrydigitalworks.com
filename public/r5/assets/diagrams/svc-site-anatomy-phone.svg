<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="sitep-t sitep-d">
  <title id="sitep-t">Diagram: example setup — example small-business site structure</title>
  <desc id="sitep-d">Illustrative site structure with one next step, Services, Recent work, Reviews, Service area, a contact path and business-held Domain, Hosting and Source.</desc>
  <rect width="360" height="240" fill="#F7F4EC"/>
  <rect x="12" y="10" width="336" height="150" rx="12" fill="#FFFFFF" stroke="#15241F" stroke-width="2"/>
  <rect x="22" y="20" width="316" height="44" rx="10" fill="#1E6B66" stroke="#15241F" stroke-width="2"/>
  <text x="180.0" y="47.6" text-anchor="middle" fill="#EFE9DD" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="700">Hero · one next step</text>
  <rect x="22" y="72" width="100" height="36" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="2"/>
  <text x="72.0" y="95.6" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="700">Services</text>
  <rect x="130" y="72" width="100" height="36" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="2"/>
