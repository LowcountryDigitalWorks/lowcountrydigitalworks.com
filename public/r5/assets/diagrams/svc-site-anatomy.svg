<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-labelledby="site-t site-d">
  <title id="site-t">Diagram: example setup — example small-business site structure</title>
  <desc id="site-d">Illustrative site structure: header, a hero with one next step, Services, Recent work, Reviews, Service area and a contact path, with Domain, Hosting and Source code marked business-held.</desc>
  <rect width="680" height="420" fill="#F7F4EC"/>
  <rect x="20" y="20" width="470" height="380" rx="14" fill="#FFFFFF" stroke="#15241F" stroke-width="2"/>
  <circle cx="44" cy="44" r="5" fill="#3A4A44" opacity=".45"/>
  <circle cx="62" cy="44" r="5" fill="#3A4A44" opacity=".45"/>
  <circle cx="80" cy="44" r="5" fill="#3A4A44" opacity=".45"/>
  <rect x="120" y="32" width="250" height="24" rx="12" fill="#F7F4EC" stroke="#3A4A44" stroke-width="1"/>
  <text x="245" y="49" text-anchor="middle" fill="#3A4A44" font-family="Manrope, system-ui, sans-serif" font-size="14" font-weight="600">yourbusiness.example</text>
  <rect x="38" y="72" width="434" height="36" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="2"/>
  <text x="255.0" y="95.6" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="16" font-weight="600">Logo  ·  Services  ·  Contact</text>
  <rect x="38" y="118" width="434" height="76" rx="10" fill="#1E6B66" stroke="#15241F" stroke-width="2"/>
  <text x="255.0" y="163.0" text-anchor="middle" fill="#EFE9DD" font-family="Manrope, system-ui, sans-serif" font-size="20" font-weight="700">What you do + one next step</text>
  <rect x="38" y="204" width="138" height="64" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="2"/>
  <text x="107.0" y="241.9" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="17" font-weight="700">Services</text>
  <rect x="186" y="204" width="138" height="64" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="2"/>
  <text x="255.0" y="241.9" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="17" font-weight="700">Recent work</text>
  <rect x="334" y="204" width="138" height="64" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="2"/>
  <text x="403.0" y="241.9" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="17" font-weight="700">Reviews</text>
  <rect x="38" y="278" width="434" height="40" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="2"/>
  <text x="255.0" y="303.9" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="17" font-weight="700">Service area</text>
  <rect x="38" y="328" width="434" height="52" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="2"/>
  <text x="255.0" y="359.9" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="17" font-weight="700">Contact path</text>
  <text x="585" y="60" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="20" font-weight="800">Business-held</text>
  <rect x="504" y="80" width="152" height="54" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="2"/>
  <text x="580.0" y="113.3" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="18" font-weight="750">Domain</text>
  <rect x="504" y="150" width="152" height="54" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="2"/>
  <text x="580.0" y="183.3" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="18" font-weight="750">Hosting</text>
  <rect x="504" y="220" width="152" height="54" rx="10" fill="#FFFFFF" stroke="#15241F" stroke-width="2"/>
  <text x="580.0" y="253.3" text-anchor="middle" fill="#15241F" font-family="Manrope, system-ui, sans-serif" font-size="18" font-weight="750">Source code</text>
  <line x1="490" y1="160" x2="504" y2="160" stroke="#15241F" stroke-width="2" stroke-dasharray="4 4"/>
</svg>
